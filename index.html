function doneView(){return `<main tabindex="-1" class="celebrate"><p class="eyebrow">MISSION GESCHAFFT</p><h1>Ein Stück Magie<br>für dein Drachenei.</h1>${drawForest()}<p>Du hast Wörter entdeckt und selbst geschrieben.</p><p class="reward">✦ +3 Zauberkraft</p>${p.completed%5===0?`<p>${p.completed===30?'Dein kleiner Drache ist geschlüpft!':p.completed<30?'Ein neues Zaubertor ist offen!':'Dein Drache freut sich über euer Abenteuer!'}</p>`:''}<div class="actions">${button('Nächste Mission','home','primary')}${button('Für heute fertig','bye','secondary')}</div></main>`;}
function byeView(){return `<main tabindex="-1" class="goodbye"><p class="eyebrow">ZEIT FÜR EINE PAUSE</p><h1>Bis zum nächsten<br>Abenteuer.</h1><p>${saveError?'Bitte sichere deinen Lernstand im Elternbereich.':'Dein Fortschritt ist gespeichert.'}</p><p>Das Ei wartet auf dich. Du musst nichts nachholen.</p>${button('Zur Profilauswahl','profiles','primary')}</main>`;}
function parentView(){const entries=Object.entries(p.stats);const hard=entries.filter(([,s])=>s.errors).sort((a,b)=>b[1].errors-a[1].errors);const mastered=entries.filter(([,s])=>s.streak>=3);const reviews=entries.filter(([,s])=>due(s,p));let recent=p.history.slice(-5),previous=p.history.slice(-10,-5);const rate=h=>{let words=h.flatMap(x=>x.words);return words.length?Math.round(100*words.filter(x=>x.writing).length/words.length)+' %':'noch keine Daten';};return `<main tabindex="-1" class="parents"><div class="section-head"><div><p class="eyebrow">ELTERNBEREICH · ${profile}</p><h1>Lernen sichtbar machen</h1></div>${button('Zurück zum Wald','home','secondary')}</div><div class="metrics"><div><b>${p.completed}</b><span>Missionen</span></div><div><b>${entries.length}</b><span>geübte Wörter</span></div><div><b>${mastered.length}</b><span>dreimal selbstständig</span></div><div><b>${reviews.length}</b><span>zur Wiederholung bereit</span></div></div><section class="panel"><h2>Handschrift im Blick</h2><p>Letzte bis zu 5 Missionen: <b>${rate(recent)}</b> richtig. Die bis zu 5 davor: <b>${rate(previous)}</b>.</p><p class="muted">Beschreibende Werte, keine Diagnose. Rätsel und Handschrift werden getrennt bewertet. Eine sichere Serie wächst nur ohne Hilfen, ohne Rätsel-Fehlversuch und mit richtiger Handschrift.</p><div class="table-wrap"><table><thead><tr><th>Strategie</th><th>Beobachtung</th></tr></thead><tbody>${TOPICS.map(t=>{let s=strategyStatus(p,t[0]);return `<tr><td>${t[2]}</td><td>${s.needs?'Transferwörter einstreuen':s.hard?'Einzelnes Wort weiter beobachten':s.samples?'Bisher kein aktueller Handschriftfehler':'Noch nicht geübt'} (${s.samples} Wörter)</td></tr>`;}).join('')}</tbody></table></div></section><section class="panel"><h2>Wörter & Wiederholungen</h2><p><b>Häufige Handschriftfehler:</b> ${hard.slice(0,12).map(([id,s])=>esc(BYID[id].word)+' ('+s.errors+')').join(', ')||'Noch keine'}</p><p><b>Gut beherrscht:</b> ${mastered.map(([id])=>esc(BYID[id].word)).join(', ')||'Entsteht nach drei selbstständigen Durchgängen.'}</p><p><b>Jetzt bereit:</b> ${reviews.map(([id])=>esc(BYID[id].word)).join(', ')||'Keine fälligen Wörter.'}</p><details><summary>Alle Ergebnisse ansehen</summary><div class="table-wrap"><table><thead><tr><th>Wort</th><th>Rätsel</th><th>Handschrift</th><th>Serie</th><th>Wiederholung</th></tr></thead><tbody>${entries.map(([id,s])=>`<tr><td>${esc(BYID[id].word)}</td><td>${s.letterCorrect}/${s.attempts}</td><td>${s.writeCorrect}/${s.attempts}</td><td>${s.streak}</td><td>${due(s,p)?'bereit':'nach '+Math.max(0,s.due-p.completed)+' weiteren Missionen'}</td></tr>`).join('')}</tbody></table></div></details><details><summary>Gespeicherte Handschriften (letzte 5 Missionen)</summary>${p.history.slice(-5).reverse().map(h=>`<h3>${new Date(h.at).toLocaleDateString('de-DE')}</h3><div class="ink-gallery">${h.words.map(w=>`<div><b>${esc(BYID[w.id].word)}</b> · ${w.writing?'richtig':'weiter üben'}${inkSvg(w.ink)}</div>`).join('')}</div>`).join('')||'<p>Noch keine abgeschlossenen Missionen.</p>'}</details></section><section class="panel"><h2>Einstellungen</h2><div class="settings-grid"><label>Wörter pro neuer Mission<select id="count">${[3,4,5].map(x=>`<option ${x===p.settings.count?'selected':''}>${x}</option>`).join('')}</select></label><label><input id="animations" type="checkbox" ${p.settings.animations?'checked':''}> Dezenter Zaubernebel</label><label><input id="sound" type="checkbox" ${p.settings.sound?'checked':''}> Kurzer Erfolgston</label></div><label>Strategie gezielt üben<select id="parent-topic">${topicOptions(selected)}</select></label>${button('Diese Mission vorbereiten','select-topic','secondary')}<label>Einzelnes Wort erneut üben<select id="word">${WORDS.map(w=>`<option value="${w.id}">${esc(w.word)} · ${TOPICS.find(t=>t[0]===w.cat)[2]}</option>`).join('')}</select></label>${button('Wort mit zwei bis vier weiteren üben','practice-word','secondary')}<p class="muted">Eine begonnene Mission wird dabei nur nach Bestätigung ersetzt. Ihre bereits bewerteten Wörter bleiben gespeichert.</p></section><section class="panel"><h2>Datensicherung</h2><p>Die Daten bleiben in diesem Browser und werden nicht zwischen Geräten synchronisiert. Browserdaten können gelöscht werden. Exportiere regelmäßig eine Sicherung.</p><div class="actions">${button('Lernstand als JSON exportieren','export','primary')}<label class="file-button">JSON importieren<input id="import" type="file" accept=".json,application/json"></label></div><p>Importiert wird nur das in der Datei genannte Profil, nach Bestätigung. Handschriften sind enthalten.</p>${button('TEST-Profil zurücksetzen','reset-test','secondary')}</section><section class="panel"><h2>Inhalte prüfen</h2><p>${validateBank().words} unterschiedliche Wörter · ${validateBank().errors.length} technische Wortbankfehler</p><details><summary>Wörter, Silben und Erklärungen</summary>${WORDS.map(w=>`<article class="word-audit"><b>${esc(w.word)}</b> · ${esc(w.syllables.join(' · '))}<p>${esc(w.prompt)}</p><p>${esc(explain(w))}</p></article>`).join('')}</details><p class="muted">Die Prüfautomatik kontrolliert Buchstabenmengen und Datenstruktur, nicht sprachwissenschaftliche Richtigkeit. Fachliche Erläuterungen und Grenzen stehen im Testbericht.</p></section></main>`;}
function inkSvg(strokes){return `<svg class="ink-preview" viewBox="0 0 800 250" aria-label="Gespeicherte Handschrift">${strokes.map(s=>s.length===1?`<circle cx="${s[0][0]*800}" cy="${s[0][1]*250}" r="2"/>`:`<polyline points="${s.map(pt=>`${pt[0]*800},${pt[1]*250}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`;}
function fog(next){if(p?.settings.animations&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const f=$('fog');f.classList.add('visible');setTimeout(()=>{next();f.classList.remove('visible');},240);}else next();}
function openTask(){fog(()=>{screen='task';render();});}
function abandon(){return !p.active||confirm('Begonnene Mission ersetzen? Bereits bewertete Wörter bleiben erhalten; die offene Aufgabe wird verworfen.');}
function sound(){if(!p.settings.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=523;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.26);o.onended=()=>c.close();}catch{}}
function check(){const t=task(),w=BYID[t.id],answer=t.chosen.map(i=>t.tiles[i]).join('');t.attempts.push(answer);if(answer===w.word){t.letter=t.attempts.length===1;t.phase='reveal';t.notice='';sound();}else{t.notice='Noch nicht ganz. Schau auf deinen Tipp und versuche es noch einmal.';t.helped=true;t.hint=Math.min(3,t.hint+1);}save();render();}
app.addEventListener('click',e=>{const target=e.target.closest('[data-act]');if(!target)return;e.preventDefault();const [action,arg]=target.dataset.act.split(':');
if(action==='profile'){const loaded=load(arg);if(!loaded)return;profile=arg;p=loaded;selected=recommendedTopic(p);screen='forest';parentOpen=false;save();render();return;}
if(action==='profiles'){if(p)save();profile=null;p=null;parentOpen=false;screen='profiles';render();return;}
if(!p)return;
if(action==='home'){save();selected=recommendedTopic(p);screen='forest';render();}
else if(action==='gate'){if(parentOpen||prompt('Elternbereich öffnen: Wie viel ist 7 × 8?')==='56'){parentOpen=true;screen='parent';render();}}
else if(action==='start'){begin(p,selected);save();openTask();}
else if(action==='resume')openTask();
else if(action==='pause'){save();fog(()=>{screen='forest';render();});}
else if(action==='bye'){save();screen='bye';render();}
else if(action==='select-topic'){if(abandon()){p.active=null;selected=$('parent-topic').value;save();screen='forest';render();}}
else if(action==='practice-word'){if(abandon()){const id=$('word').value;selected=BYID[id].cat;begin(p,selected,id);save();openTask();}}
else if(action==='export'){const blob=new Blob([JSON.stringify({app:'drachenei',version:1,profile,exported:new Date().toISOString(),data:p},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Drachenei-'+profile+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
else if(action==='reset-test'){if(confirm('Nur den TEST-Lernstand vollständig löschen? Eliano bleibt erhalten.')){try{localStorage.removeItem(KEY+'TEST');if(profile==='TEST'){p=fresh();save();}render();}catch{alert('Zurücksetzen war nicht möglich.');}}}
else if(p.active){const t=task(),w=BYID[t.id];
 if(action==='tile'&&t.phase==='build'){const i=Number(arg);if(!t.chosen.includes(i)&&t.chosen.map(i=>t.tiles[i]).join('').length+t.tiles[i].length<=w.word.length){t.chosen.push(i);t.notice='';}}
 else if(action==='undo'&&t.phase==='build')t.chosen.pop();
 else if(action==='clear'&&t.phase==='build'){t.chosen=[];t.notice='';}
 else if(action==='check'&&t.phase==='build'){check();return;}
 else if(action==='hint'&&t.phase==='build'){t.helped=true;t.hint=Math.min(4,t.hint+1);if(t.hint===4){t.letter=false;t.phase='reveal';}}
 else if(action==='family'&&t.phase==='family'){if(arg===w.anchor){t.familyDone=true;t.phase='build';t.notice='';}else{t.helped=true;t.notice='Dieser Baustein passt noch nicht. Denk an die Bedeutung.';}}
 else if(action==='hide-memory'&&t.phase==='study')t.phase='build';
 else if(action==='write'&&t.phase==='reveal')t.phase='write';
 else if(action==='peek'&&t.phase==='write'){t.helped=true;t.phase='reveal';}
 else if(action==='clear-ink'&&t.phase==='write')t.ink=[];
 else if(action==='compare'&&t.phase==='write'){if(!t.ink.some(x=>x.length)){alert('Schreibe erst etwas in das Feld.');return;}t.phase='compare';}
 else if(action==='rate'&&t.phase==='compare'&&t.writing===null){t.writing=arg==='true';record(p,t);t.phase='rated';}
 else if(action==='next'&&t.phase==='rated'){if(p.active.index+1<p.active.tasks.length){p.active.index++;}else{complete(p);save();fog(()=>{screen='done';render();});return;}}
 else if(action==='sim'&&profile==='TEST'&&t.phase==='build'){t.chosen=[];if(arg==='true'){for(const c of t.mode==='syllable'?w.syllables:[...w.word]){const idx=t.tiles.findIndex((x,i)=>x===c&&!t.chosen.includes(i));t.chosen.push(idx);}}else t.chosen=[0];check();return;}
 save();render();
}
});
app.addEventListener('change',async e=>{if(!p)return;const id=e.target.id;if(id==='test-topic'){selected=e.target.value;render();}if(id==='count'){p.settings.count=Number(e.target.value);save();}if(['animations','sound'].includes(id)){p.settings[id]=e.target.checked;save();}if(id==='import'){const f=e.target.files[0];if(!f)return;try{if(f.size>25000000)throw Error('Datei zu groß.');const incoming=importPayload(await f.text());if(confirm(`Lernstand von ${incoming.profile} durch ${incoming.data.completed} abgeschlossene Missionen aus der Datei ersetzen? Der bisherige Stand dieses Profils wird überschrieben.`)){localStorage.setItem(KEY+incoming.profile,JSON.stringify(incoming.data));if(profile===incoming.profile)p=incoming.data;render();alert('Lernstand importiert.');}}catch(err){alert('Import nicht durchgeführt: '+err.message);}e.target.value='';}});
function setupCanvas(){const c=$('writing'),t=task(),readonly=t.phase!=='write';const ctx=c.getContext('2d');let pointer=null,current=null,scheduled=false;const resize=()=>{const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,3);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);paint();};
 function paint(){const r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle='#d5dfdd';ctx.lineWidth=1;for(const y of [.25,.5,.75]){ctx.beginPath();ctx.moveTo(12,r.height*y);ctx.lineTo(r.width-12,r.height*y);ctx.stroke();}ctx.strokeStyle='#203f4a';ctx.lineCap='round';ctx.lineJoin='round';for(const s of t.ink){if(!s.length)continue;ctx.beginPath();ctx.moveTo(s[0][0]*r.width,s[0][1]*r.height);for(const pt of s){ctx.lineWidth=2+pt[2]*2;ctx.lineTo(pt[0]*r.width,pt[1]*r.height);}if(s.length===1)ctx.lineTo(s[0][0]*r.width+.1,s[0][1]*r.height+.1);ctx.stroke();}}
 function point(e){const r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),Math.max(0,Math.min(1,e.pressure||.5))];}
 c.addEventListener('pointerdown',e=>{if(readonly||pointer!==null)return;e.preventDefault();pointer=e.pointerId;current=[point(e)];t.ink.push(current);c.setPointerCapture(e.pointerId);paint();save();});
 c.addEventListener('pointermove',e=>{if(readonly||pointer!==e.pointerId||!current)return;e.preventDefault();for(const ev of e.getCoalescedEvents?e.getCoalescedEvents():[e])current.push(point(ev));paint();if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;save();});}});
 const end=e=>{if(pointer===e.pointerId){pointer=null;current=null;save();}};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);const ro=new ResizeObserver(resize);ro.observe(c);canvasCleanup=()=>ro.disconnect();resize();}
window.addEventListener('pagehide',()=>{if(p)save();});document.addEventListener('visibilitychange',()=>{if(p&&document.hidden)save();});
window.addEventListener('storage',e=>{if(profile&&e.key===KEY+profile){alert('Dieser Lernstand wurde in einem anderen Tab verändert. Bitte wähle das Profil erneut.');profile=null;p=null;screen='profiles';render();}});
render();
}
</script></body></html>
